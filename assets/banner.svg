<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 372" width="860" height="372" role="img" aria-label="Terminal window that introduces Anil, a senior full-stack engineer and team lead working on web, mobile, web3, and Rust">
  <defs>
    <clipPath id="window">
      <rect x="1" y="1" width="858" height="370" rx="12"/>
    </clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 17px; fill: #f5f5f5; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #b4b4b4; }
      .prompt { fill: #8c8c8c; }
      .out { fill: #d6d6d6; }
      .hl { fill: #ffd866; font-weight: 700; }
      .line { animation: show 0.4s ease-out backwards; }
      .l1 { animation-delay: 0.3s; }
      .l2 { animation-delay: 1.0s; }
      .l3 { animation-delay: 1.9s; }
      .l4 { animation-delay: 2.6s; }
      .l5 { animation-delay: 3.5s; }
      .l6 { animation-delay: 4.2s; }
      .l7 { animation-delay: 5.1s; }
      .l8 { animation-delay: 5.8s; }
      .l9 { animation-delay: 6.6s; }
      .cursor { fill: #f5f5f5; animation: blink 1.1s steps(1) 6.7s infinite; }
      @keyframes show { from { opacity: 0; } }
      @keyframes blink { 50% { fill-opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .line, .cursor { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#window)">
    <rect x="0" y="0" width="860" height="372" fill="#161616"/>
    <rect x="0" y="0" width="860" height="42" fill="#323232"/>
    <rect x="0" y="42" width="860" height="1" fill="#000000"/>
  </g>
  <rect x="1" y="1" width="858" height="370" rx="12" fill="none" stroke="#4a4a4a" stroke-width="1"/>
  <circle cx="26" cy="22" r="6.5" fill="#ff5f57"/>
  <circle cx="48" cy="22" r="6.5" fill="#febc2e"/>
  <circle cx="70" cy="22" r="6.5" fill="#28c840"/>
  <text x="430" y="27" text-anchor="middle" class="title">anil — -zsh — 80×24</text>

  <g class="mono">
    <text x="28" y="82" class="line l1"><tspan class="prompt">% </tspan>whoami</text>
    <text x="28" y="110" class="line l2"><tspan class="out">anil · </tspan><tspan class="hl">senior full-stack engineer</tspan><tspan class="out"> · </tspan><tspan class="hl">team lead</tspan></text>

    <text x="28" y="152" class="line l3"><tspan class="prompt">% </tspan>cat focus.txt</text>
    <text x="28" y="180" class="line l4"><tspan class="out">web and mobile apps · web3 · Rust backends · privacy tools</tspan></text>

    <text x="28" y="222" class="line l5"><tspan class="prompt">% </tspan>uptime</text>
    <text x="28" y="250" class="line l6"><tspan class="hl">7+ years</tspan><tspan class="out"> · </tspan><tspan class="hl">15+ products</tspan><tspan class="out"> shipped to production</tspan></text>

    <text x="28" y="292" class="line l7"><tspan class="prompt">% </tspan>cat now.txt</text>
    <text x="28" y="320" class="line l8"><tspan class="out">real-time data systems in </tspan><tspan class="hl">Rust</tspan></text>

    <text x="28" y="354" class="line l9"><tspan class="prompt">% </tspan><tspan class="cursor">█</tspan></text>
  </g>
</svg>
