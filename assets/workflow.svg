<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 268" width="860" height="268" role="img" aria-label="My working loop in eight steps: idea, read the source, design, build, test and review, automated release, monitor, learn, and back to idea. I mentor the team at every step.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8c8c8c"/>
    </marker>
    <style>
      .box { fill: #161616; stroke: #4a4a4a; stroke-width: 1; }
      .box-hl { fill: #161616; stroke: #ffd866; stroke-width: 2; }
      .num { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #ffd866; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #f5f5f5; }
      .label-hl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #ffd866; }
      .sub { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 11px; fill: #a8a8a8; }
      .edge { stroke: #8c8c8c; stroke-width: 1.5; fill: none; }
      .note { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; fill: #8c8c8c; }
      .pill { fill: none; stroke: #8c8c8c; stroke-width: 1; stroke-dasharray: 4 4; }
      .step { animation: show 0.45s ease-out backwards; }
      @keyframes show { from { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .step { animation: none; } }
    </style>
  </defs>

  <g>
    <line x1="195" y1="60" x2="231" y2="60" class="edge" marker-end="url(#arrow)"/>
    <line x1="411" y1="60" x2="447" y2="60" class="edge" marker-end="url(#arrow)"/>
    <line x1="627" y1="60" x2="663" y2="60" class="edge" marker-end="url(#arrow)"/>
    <line x1="754" y1="96" x2="754" y2="170" class="edge" marker-end="url(#arrow)"/>
    <line x1="665" y1="208" x2="629" y2="208" class="edge" marker-end="url(#arrow)"/>
    <line x1="449" y1="208" x2="413" y2="208" class="edge" marker-end="url(#arrow)"/>
    <line x1="233" y1="208" x2="197" y2="208" class="edge" marker-end="url(#arrow)"/>
    <line x1="106" y1="172" x2="106" y2="98" class="edge" marker-end="url(#arrow)"/>
  </g>
  <rect x="285" y="117" width="290" height="34" rx="17" class="pill"/>
  <text x="430" y="139" text-anchor="middle" class="note">mentor the team at every step</text>
  <g class="step" style="animation-delay: 0.20s">
    <rect x="21" y="28" width="170" height="64" rx="8" class="box"/>
    <text x="31" y="46" class="num">01</text>
    <text x="106" y="69" text-anchor="middle" class="label">Idea</text>
  </g>
  <g class="step" style="animation-delay: 0.55s">
    <rect x="237" y="28" width="170" height="64" rx="8" class="box"/>
    <text x="247" y="46" class="num">02</text>
    <text x="322" y="69" text-anchor="middle" class="label">Read the source</text>
  </g>
  <g class="step" style="animation-delay: 0.90s">
    <rect x="453" y="28" width="170" height="64" rx="8" class="box"/>
    <text x="463" y="46" class="num">03</text>
    <text x="538" y="69" text-anchor="middle" class="label">Design</text>
  </g>
  <g class="step" style="animation-delay: 1.25s">
    <rect x="669" y="28" width="170" height="64" rx="8" class="box"/>
    <text x="679" y="46" class="num">04</text>
    <text x="754" y="64" text-anchor="middle" class="label">Build</text>
    <text x="754" y="81" text-anchor="middle" class="sub">frontend · backend</text>
  </g>
  <g class="step" style="animation-delay: 1.60s">
    <rect x="669" y="176" width="170" height="64" rx="8" class="box"/>
    <text x="679" y="194" class="num">05</text>
    <text x="754" y="217" text-anchor="middle" class="label">Test and review</text>
  </g>
  <g class="step" style="animation-delay: 1.95s">
    <rect x="453" y="176" width="170" height="64" rx="8" class="box-hl"/>
    <text x="463" y="194" class="num">06</text>
    <text x="538" y="217" text-anchor="middle" class="label-hl">Automated release</text>
  </g>
  <g class="step" style="animation-delay: 2.30s">
    <rect x="237" y="176" width="170" height="64" rx="8" class="box"/>
    <text x="247" y="194" class="num">07</text>
    <text x="322" y="217" text-anchor="middle" class="label">Monitor</text>
  </g>
  <g class="step" style="animation-delay: 2.65s">
    <rect x="21" y="176" width="170" height="64" rx="8" class="box"/>
    <text x="31" y="194" class="num">08</text>
    <text x="106" y="217" text-anchor="middle" class="label">Learn</text>
  </g>
</svg>
